<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nabídka pro WEED420SHOP</title>
<meta name="description" content="Vlastní katalog nabídky v telefonu tvých zákazníků.">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#142E1C">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WEED420SHOP">

<style>
:root{
  --bg:#F6F8F4; --card:#FFFFFF;
  --ink:#131A13; --ink-2:#3A4437; --muted:#6C7869;
  --line:#E0E6DB; --line-2:#CBD4C4;
  --brand:#1E4A2C; --brand-ink:#2E6B3E; --brand-soft:#E7EFE5;
  --sale:#A8342A;
  --shadow:0 1px 2px rgba(19,26,19,.05), 0 6px 20px -10px rgba(19,26,19,.18);
  --bar:rgba(246,248,244,.88);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0C100B; --card:#141A13;
    --ink:#E9EEE6; --ink-2:#C3CCBE; --muted:#8B9787;
    --line:#232B21; --line-2:#36402F;
    --brand:#7FCB8D; --brand-ink:#7FCB8D; --brand-soft:#16220F;
    --sale:#EC8878;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 20px -10px rgba(0,0,0,.7);
    --bar:rgba(12,16,11,.88);
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
:focus-visible{outline:2px solid var(--brand-ink);outline-offset:2px;border-radius:6px;}

/* ---------- hlavicka ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--bar);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.brandrow{display:flex;align-items:center;gap:.7rem;padding:.7rem 1rem .55rem;}
.mark{width:2rem;height:2rem;border-radius:8px;background:var(--brand);display:grid;place-items:center;flex:none;}
.mark svg{width:1.15rem;height:1.15rem;display:block;}
.brandtext{display:flex;flex-direction:column;line-height:1.2;min-width:0;}
.brandtext .n{font-weight:700;font-size:.95rem;letter-spacing:-.005em;}
.brandtext .s{font-size:.73rem;color:var(--muted);}

.chips{display:flex;gap:.4rem;overflow-x:auto;padding:0 1rem .65rem;scrollbar-width:none;-ms-overflow-style:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{
  flex:none;padding:.36rem .8rem;border-radius:999px;
  border:1px solid var(--line-2);
  font-size:.83rem;font-weight:550;color:var(--ink-2);white-space:nowrap;
}
.chip[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:#F2F8F1;}
@media (prefers-color-scheme: dark){ .chip[aria-selected="true"]{color:#0C100B;} }

/* ---------- vyzva k instalaci ---------- */
.install{
  margin:.85rem 1rem 0;background:var(--brand-soft);border:1px solid var(--line-2);
  border-radius:12px;padding:.85rem .95rem;display:flex;gap:.75rem;align-items:flex-start;font-size:.88rem;
}
.install svg{width:1.15rem;height:1.15rem;flex:none;margin-top:.1rem;color:var(--brand-ink);}
.install .t{font-weight:700;display:block;margin-bottom:.15rem;}
.install .x{margin-left:auto;color:var(--muted);font-size:1.35rem;line-height:1;flex:none;}
.install button.act{margin-top:.5rem;background:var(--brand);color:#F2F8F1;padding:.45rem .85rem;border-radius:8px;font-size:.85rem;font-weight:600;}
@media (prefers-color-scheme: dark){ .install button.act{color:#0C100B;} }

/* ---------- zed ---------- */
.feed{padding:.85rem 1rem calc(2rem + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:.85rem;max-width:34rem;margin:0 auto;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);width:100%;transition:transform .12s ease;}
.card:active{transform:scale(.988);}
.thumb{position:relative;aspect-ratio:16/9;display:flex;align-items:flex-end;padding:.75rem .85rem;}
.thumb .kicker{font-size:.68rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.92);text-shadow:0 1px 3px rgba(0,0,0,.35);}
.badges{position:absolute;top:.7rem;left:.85rem;display:flex;gap:.35rem;}
.badge{font-size:.66rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:.24rem .5rem;border-radius:6px;background:rgba(255,255,255,.94);color:var(--brand);}
.badge.sale{background:var(--sale);color:#fff;}
.fav{position:absolute;top:.55rem;right:.6rem;width:2.1rem;height:2.1rem;border-radius:999px;background:rgba(255,255,255,.9);display:grid;place-items:center;}
.fav svg{width:1.15rem;height:1.15rem;color:#5D6A59;}
.fav[aria-pressed="true"] svg{color:#C6392B;fill:#C6392B;}
.cbody{padding:.8rem .95rem 1rem;display:flex;flex-direction:column;gap:.3rem;}
.cbody h2{margin:0;font-size:1.05rem;font-weight:700;letter-spacing:-.012em;line-height:1.3;}
.cbody p{margin:0;font-size:.9rem;color:var(--muted);}
.cmeta{display:flex;gap:.45rem;margin-top:.35rem;font-size:.75rem;color:var(--brand-ink);font-weight:600;}

.g1{background:linear-gradient(135deg,#1E4A2C,#2E6B3E 55%,#48885A);}
.g2{background:linear-gradient(135deg,#25443A,#356B57 55%,#4E9179);}
.g3{background:linear-gradient(135deg,#1C3A44,#2B5C68 55%,#3E838F);}
.g4{background:linear-gradient(135deg,#43301F,#6B4C2E 55%,#8E6A45);}
.g5{background:linear-gradient(135deg,#2E2140,#4A3568 55%,#66508A);}

/* ---------- detail ---------- */
.detail{
  position:fixed;inset:0;z-index:60;background:var(--bg);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateX(100%);transition:transform .24s cubic-bezier(.32,.72,0,1);visibility:hidden;
}
.detail.open{transform:translateX(0);visibility:visible;}
.dbar{
  position:sticky;top:0;z-index:2;background:var(--bar);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);display:flex;
}
.dbar button{display:flex;align-items:center;gap:.3rem;padding:.75rem 1rem;font-size:.95rem;color:var(--brand-ink);font-weight:600;}
.dbar svg{width:1.1rem;height:1.1rem;}
.dhero{aspect-ratio:16/9;display:flex;align-items:flex-end;padding:1rem;}
.dhero .kicker{font-size:.7rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.92);text-shadow:0 1px 3px rgba(0,0,0,.35);}

.dcontent{
  padding:1.25rem 1.15rem calc(3rem + env(safe-area-inset-bottom));
  max-width:34rem;margin:0 auto;
  display:flex;flex-direction:column;gap:1.05rem;
}
.dcontent h1{margin:0;font-size:1.5rem;line-height:1.2;letter-spacing:-.02em;font-weight:700;text-wrap:balance;}
.dcontent p{margin:0;font-size:.97rem;color:var(--ink-2);}
.dcontent h3{margin:.5rem 0 0;font-size:.95rem;font-weight:700;}
.dcontent ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.5rem;}
.dcontent ul li{display:grid;grid-template-columns:1.05rem 1fr;gap:.5rem;font-size:.95rem;color:var(--ink-2);}
.dcontent ul li::before{content:"";width:.4rem;height:.4rem;border-radius:50%;background:var(--brand-ink);margin-top:.52rem;margin-left:.3rem;}
.dcontent ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.65rem;counter-reset:s;}
.dcontent ol li{display:grid;grid-template-columns:1.5rem 1fr;gap:.55rem;font-size:.95rem;color:var(--ink-2);counter-increment:s;}
.dcontent ol li::before{content:counter(s);font-size:.8rem;font-weight:700;color:var(--brand-ink);padding-top:.14rem;}
.dcontent strong{color:var(--ink);font-weight:700;}

.rows{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);}
.row{display:flex;justify-content:space-between;gap:.9rem;padding:.7rem .9rem;border-bottom:1px solid var(--line);font-size:.93rem;}
.row:last-child{border-bottom:0;}
.row span:first-child{color:var(--muted);}
.row b{white-space:nowrap;font-variant-numeric:tabular-nums;}
.row.big{background:var(--brand-soft);}
.row.big b{font-size:1.15rem;}

.callout{background:var(--brand-soft);border-left:3px solid var(--brand-ink);border-radius:0 10px 10px 0;padding:.8rem .95rem;font-size:.93rem;color:var(--ink-2);}
.callout strong{color:var(--brand-ink);}

.fill{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em;background:var(--brand-soft);color:var(--brand-ink);padding:.08em .4em;border-radius:4px;white-space:nowrap;}

footer.appfoot{border-top:1px solid var(--line);margin-top:.4rem;padding:1.4rem 1rem calc(2rem + env(safe-area-inset-bottom));text-align:center;font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:.3rem;}
footer.appfoot b{color:var(--ink);font-size:.9rem;}

@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<div class="topbar">
  <div class="brandrow">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#EAF4E8" stroke-width="2" stroke-linecap="round">
        <path d="M12 21V10"/>
        <path d="M12 13c-1-3-4-4.5-7-4 .5 3 3 5 7 4z" fill="#EAF4E8" stroke="none"/>
        <path d="M12 11c1-3.2 4-5 7.5-4.5C19 10 16 12 12 11z" fill="#EAF4E8" stroke="none"/>
      </svg>
    </div>
    <div class="brandtext">
      <span class="n">WEED420SHOP</span>
      <span class="s">nabídka na appku</span>

  <div class="chips" role="tablist" id="chips"></div>
</div>

<div id="installSlot"></div>
<main class="feed" id="feed"></main>

<footer class="appfoot">
  <b>Jan Fiedler</b>
  <span><span class="fill">+420 604 132 567</span></span>
</footer>

<section class="detail" id="detail" aria-hidden="true">
  <div class="dbar">
    <button type="button" id="back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Zpět
    </button>
  </div>
  <div class="dhero" id="dhero"><span class="kicker" id="dkicker"></span></div>
  <div class="dcontent" id="dcontent"></div>
</section>

<script>
const CATS = [
  {id:'vse',     label:'Vše'},
  {id:'cotoje',  label:'Co to je'},
  {id:'funkce',  label:'Co to umí'},
  {id:'cena',    label:'Cena'},
  {id:'domluva', label:'Domluva'}
];

const POSTS = [
{
  id:'pitch', cat:'cotoje', g:'g1', kicker:'Shrnutí', pinned:true,
  title:'Co ti postavím',
  excerpt:'Vlastní katalog v telefonu tvých zákazníků. Nikdo ti ho nevypne.',
  body:`
    <p>Appka, kterou si zákazník přidá na plochu telefonu. Dovnitř se dostane jen přes QR kód, co mu dáš na place.</p>
    <p>Poběží na <strong>tvojí doméně a tvým serveru</strong>. Neschvaluje to žádný app store — takže to ani žádný app store nemůže zrušit.</p>
    <div class="rows">
      <div class="row big"><span>Vývoj</span><b>60 000 Kč</b></div>
      <div class="row"><span>Provoz</span><b>2 500 Kč / měs</b></div>
      <div class="row"><span>Hotovo za</span><b>8 týdnů</b></div>
    </div>`
},
{
  id:'meta', cat:'cotoje', g:'g2', kicker:'Ukázka',
  title:'Tohle je ta appka',
  excerpt:'Nečteš dokument o aplikaci. Čteš tu aplikaci.',
  body:`
    <p>Všechno, cos právě udělal, budou dělat i tvoji zákazníci:</p>
    <ul>
      <li>Zeď příspěvků, nejnovější nahoře</li>
      <li>Připnutý příspěvek zůstává první</li>
      <li>Kategorie v liště nahoře</li>
      <li>Detail po klepnutí</li>
      <li>Srdíčko = oblíbené</li>
      <li>Ikona na ploše, bez prohlížeče</li>
    </ul>
    <div class="callout"><strong>Zkus si režim letadla</strong> a projdi to znovu. Jede to dál.</div>
    <p>Místo těch barevných ploch tam budou fotky tvýho zboží.</p>`
},
{
  id:'flow', cat:'funkce', g:'g3', kicker:'Jak se tam lidi dostanou',
  title:'QR kód z obchodu',
  excerpt:'Naskenuje, potvrdí 18+, hotovo. Žádná registrace.',
  body:`
    <p>Appka je neveřejná. Nikdo ji nenajde a bez kódu se dovnitř nedostane.</p>
    <ol>
      <li>Dáš mu na place QR kód — kartička, účtenka, samolepka u kasy</li>
      <li>Naskenuje ho a potvrdí 18+</li>
      <li>Přidá si to na plochu</li>
      <li>Povolí upozornění na novinky</li>
    </ol>
    <div class="callout">Kdyby kód unikl, vygeneruješ si novej a starej přestane platit.</div>`
},
{
  id:'features', cat:'funkce', g:'g1', kicker:'Funkce',
  title:'Co to bude umět',
  excerpt:'Zeď, kategorie, akce, oblíbené a upozornění na novinky.',
  body:`
    <h3>Zákazník</h3>
    <ul>
      <li>Zeď s fotkou, popisem a cenou</li>
      <li>Kategorie a hledání</li>
      <li>Akce a slevy s platností</li>
      <li>Oblíbené</li>
      <li>Upozornění na novinky</li>
      <li>Otvíračka, mapa, zavolat</li>
    </ul>
    <h3>Ty</h3>
    <ul>
      <li>Přidáš příspěvek z mobilu — vyfotíš, napíšeš, publikuješ</li>
      <li>Upravíš i smažeš kdykoli</li>
      <li>Připneš nahoru, označíš jako akci</li>
      <li><strong>Kategorie si děláš sám</strong> — přidat, přejmenovat, přeskládat</li>
      <li>Pošleš upozornění jedním tlačítkem</li>
      <li>Vygeneruješ novej přístupovej kód</li>
    </ul>`
},
{
  id:'price', cat:'cena', g:'g4', kicker:'Cena', sale:true,
  title:'Co to stojí',
  excerpt:'60 000 za vývoj, 2 500 měsíčně za provoz. Applu a Googlu nic.',
  body:`
    <div class="rows">
      <div class="row big"><span>Vývoj celkem</span><b>60 000 Kč</b></div>
      <div class="row"><span>Záloha při podpisu</span><b>24 000 Kč</b></div>
      <div class="row"><span>Po funkční verzi</span><b>18 000 Kč</b></div>
      <div class="row"><span>Při spuštění</span><b>18 000 Kč</b></div>
    </div>
    <h3>V provozu za 2 500 Kč / měs je</h3>
    <ul>
      <li>Server, aktualizace, dohled</li>
      <li>Denní zálohy</li>
      <li>Drobný úpravy do hodiny měsíčně</li>
      <li>Reakce do dvou pracovních dnů</li>
    </ul>
    <h3>Platíš přímo poskytovatelům</h3>
    <div class="rows">
      <div class="row"><span>Server</span><b>~250 Kč / měs</b></div>
      <div class="row"><span>Doména</span><b>~300 Kč / rok</b></div>
      <div class="row"><span>Apple + Google</span><b>0 Kč</b></div>
    </div>
    <p>Nejsem plátce DPH, ceny jsou konečný.</p>`
},
{
  id:'deal', cat:'domluva', g:'g5', kicker:'Domluva',
  title:'Ať jsme domluvení',
  excerpt:'Co potřebuju od tebe, co v tom není a pár vět na rovinu.',
  body:`
    <h3>Potřebuju od tebe</h3>
    <ul>
      <li>Logo a barvy</li>
      <li>Kategorie — klidně jen 4 až 6 na začátek</li>
      <li>10–15 produktů s fotkama, popisem a cenou</li>
      <li>IČO, adresa, otvíračka</li>
      <li>Doménu a server na tvoje IČO — pomůžu ti to zařídit</li>
    </ul>
    <p>tři týdny běží od chvíle, kdy tohle mám. Ne od podpisu.</p>

    <h3>V ceně není</h3>
    <ul>
      <li>Košík, objednávky, platby</li>
      <li>Propojení s pokladnou nebo skladem</li>
      <li>Focení zboží a psaní popisků</li>
      <li>Tisk QR kódů a kartiček</li>
      <li>Verze do App Store a Google Play</li>
    </ul>

    <h3>Na rovinu</h3>
    <ul>
      <li>Dvě kola připomínek v ceně, pak 900 Kč/hod</li>
      <li>30 dní po spuštění opravuju chyby zdarma</li>
      <li>Kód je tvůj, jakmile doplatíš</li>
      <li>Dělám až po záloze — ať se nám to nerozmělní</li>
    </ul>

    <div class="callout"><strong>Jedna věc navíc:</strong> popisky zboží si nech jednou projít advokátem. Nejsem právník a za obsah appky ručíš ty.</div>`
}
];

/* ---------- stav ---------- */
const store = {
  get favs(){ try{ return JSON.parse(localStorage.getItem('favs')||'[]'); }catch(e){ return []; } },
  set favs(v){ try{ localStorage.setItem('favs', JSON.stringify(v)); }catch(e){} }
};
let active = 'vse';

const feed = document.getElementById('feed');
const chipbar = document.getElementById('chips');
const ICON_HEART = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 00-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 000-7.8z"/></svg>';

function renderChips(){
  chipbar.innerHTML = '';
  CATS.forEach(c=>{
    const b = document.createElement('button');
    b.className='chip'; b.type='button'; b.role='tab';
    b.textContent = c.label;
    b.setAttribute('aria-selected', String(active === c.id));
    b.addEventListener('click', ()=>{ active=c.id; renderChips(); renderFeed(); window.scrollTo({top:0,behavior:'smooth'}); });
    chipbar.appendChild(b);
  });
}

function renderFeed(){
  const favs = store.favs;
  const list = POSTS.filter(p => active==='vse' || p.cat===active)
                    .sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0));
  feed.innerHTML = '';
  list.forEach(p=>{
    const card = document.createElement('article');
    card.className = 'card';
    const badges = [];
    if(p.pinned) badges.push('<span class="badge">Připnuto</span>');
    if(p.sale)   badges.push('<span class="badge sale">Akce</span>');
    card.innerHTML = `
      <div class="thumb ${p.g}">
        <div class="badges">${badges.join('')}</div>
        <button class="fav" type="button" aria-pressed="${favs.includes(p.id)}" aria-label="Přidat do oblíbených">${ICON_HEART}</button>
        <span class="kicker">${p.kicker}</span>
      </div>
      <div class="cbody">
        <h2>${p.title}</h2>
        <p>${p.excerpt}</p>
        <span class="cmeta">Číst dál →</span>
      </div>`;
    card.querySelector('.fav').addEventListener('click', e=>{
      e.stopPropagation();
      const f = store.favs, i = f.indexOf(p.id);
      if(i<0) f.push(p.id); else f.splice(i,1);
      store.favs = f;
      e.currentTarget.setAttribute('aria-pressed', String(i<0));
    });
    card.addEventListener('click', ()=> openDetail(p));
    feed.appendChild(card);
  });
}

/* ---------- detail ---------- */
const detail=document.getElementById('detail'), dhero=document.getElementById('dhero'),
      dkicker=document.getElementById('dkicker'), dcontent=document.getElementById('dcontent');

function openDetail(p){
  dhero.className = 'dhero ' + p.g;
  dkicker.textContent = p.kicker;
  dcontent.innerHTML = `<h1>${p.title}</h1>` + p.body;
  detail.classList.add('open');
  detail.setAttribute('aria-hidden','false');
  detail.scrollTop = 0;
  document.body.style.overflow = 'hidden';
  history.pushState({detail:true}, '');
}
function closeDetail(){
  detail.classList.remove('open');
  detail.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
}
document.getElementById('back').addEventListener('click', ()=> history.back());
window.addEventListener('popstate', closeDetail);

/* ---------- pridat na plochu ---------- */
const slot = document.getElementById('installSlot');
const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
let deferred = null;
const ICON_SHARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V3"/><path d="M8 7l4-4 4 4"/><path d="M4 14v5a2 2 0 002 2h12a2 2 0 002-2v-5"/></svg>';

function showInstall(html, withButton){
  if(sessionStorage.getItem('installDismissed')) return;
  slot.innerHTML = `<div class="install">${ICON_SHARE}<div>${html}${withButton?'<button class="act" type="button" id="doInstall">Přidat na plochu</button>':''}</div><button class="x" type="button" aria-label="Zavřít">&times;</button></div>`;
  slot.querySelector('.x').addEventListener('click', ()=>{ slot.innerHTML=''; try{sessionStorage.setItem('installDismissed','1');}catch(e){} });
  const btn = document.getElementById('doInstall');
  if(btn) btn.addEventListener('click', async ()=>{
    if(!deferred) return;
    deferred.prompt(); await deferred.userChoice; deferred = null; slot.innerHTML='';
  });
}

window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault(); deferred = e;
  if(!standalone) showInstall('<span class="t">Přidej si to na plochu</span>Otevře se na celou obrazovku a pojede i bez signálu.', true);
});
if(!standalone && isIOS){
  showInstall('<span class="t">Přidej si to na plochu</span>Klepni dole na <strong>Sdílet</strong> a dej <strong>Přidat na plochu</strong>.', false);
}

/* ---------- start ---------- */
renderChips();
renderFeed();

if('serviceWorker' in navigator){
  const reg = ()=> navigator.serviceWorker.register('sw.js')
    .catch(e => console.warn('Service worker se nepodařilo zaregistrovat:', e.message));
  if(document.readyState === 'complete') reg();
  else window.addEventListener('load', reg);
}
</script>
</body>
</html>
