<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WEED420SHOP</title>
<meta name="description" content="Nabídka prodejny přímo v telefonu.">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#11120F">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WEED420SHOP">

<style>
/* Znacka prodejny je barevna a tmava - drzime jeden vzhled zamerne. */
:root{
  --bg:#11120F;
  --surface:#1B1D18;
  --surface-2:#242720;
  --ink:#ECEFE6;
  --ink-2:#BFC6B6;
  --muted:#88907E;
  --line:#2C3028;
  --red:#D3341F;
  --yellow:#F2C110;
  --green:#2EBE58;
  --green-dim:#1E7C3A;
  --bar:rgba(17,18,15,.9);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
button,input,textarea{font:inherit;color:inherit;background:none;border:0;}
button{cursor:pointer;padding:0;}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:8px;}
img{max-width:100%;display:block;}

/* ---------- horni lista ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--bar);
  backdrop-filter:saturate(160%) blur(14px);
  -webkit-backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.brandrow{display:flex;align-items:center;gap:.7rem;padding:.6rem .9rem;}
.logo{
  width:2.4rem;height:2.4rem;border-radius:10px;flex:none;
  background:#000;overflow:hidden;display:grid;place-items:center;
  border:1px solid var(--line);
}
.logo img{width:100%;height:100%;object-fit:contain;}
.logo .lf{font-size:1.2rem;}
.who{display:flex;flex-direction:column;min-width:0;line-height:1.25;flex:1;}
.who .n{font-weight:800;font-size:1rem;letter-spacing:.02em;}
.who .s{font-size:.74rem;color:var(--muted);}
.who .s b{color:var(--green);font-weight:600;}
.iconbtn{
  width:2.3rem;height:2.3rem;border-radius:999px;flex:none;
  display:grid;place-items:center;color:var(--ink-2);
}
.iconbtn:hover{background:var(--surface-2);}
.iconbtn svg{width:1.3rem;height:1.3rem;}

/* rasta prouzek */
.stripe{height:3px;display:flex;}
.stripe i{flex:1;}
.stripe i:nth-child(1){background:var(--red);}
.stripe i:nth-child(2){background:var(--yellow);}
.stripe i:nth-child(3){background:var(--green);}

/* hledani */
.searchwrap{padding:0 .9rem .65rem;display:none;}
.searchwrap.on{display:block;}
.searchwrap input{
  width:100%;background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:.55rem .95rem;font-size:.92rem;color:var(--ink);
}
.searchwrap input::placeholder{color:var(--muted);}

/* ---------- kanal ---------- */
.feed{
  max-width:34rem;margin:0 auto;
  padding:.8rem .8rem calc(6rem + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:.8rem;
}
.msg{
  background:var(--surface);border:1px solid var(--line);
  border-radius:16px;overflow:hidden;position:relative;
}
.msg.pinned{border-color:var(--yellow);}
.shot{position:relative;background:var(--surface-2);}
/* Fotka si nese vlastni pomer stran - nic se neoreza.
   width/height v HTML drzi misto, takze pri nacitani neposkakuje layout. */
.shot img{width:100%;height:auto;display:block;}
.ph{
  aspect-ratio:var(--ar,4/3);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.4rem;color:#fff;
}

/* uvodni banner, odroluje pryc */
.cover{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000;}
.cover img{width:100%;height:auto;display:block;}
.ph .nm{font-weight:800;font-size:1rem;letter-spacing:.03em;text-shadow:0 1px 4px rgba(0,0,0,.4);}
.ph .hint{font-size:.72rem;opacity:.85;}
.ph.b{background:linear-gradient(150deg,#123B63,#2E7FC4);}
.ph.g{background:linear-gradient(150deg,#125A2A,#3CBF63);}
.ph.p{background:linear-gradient(150deg,#6B1F4A,#D2569B);}
.ph.n{background:linear-gradient(150deg,#3A3320,#7A6A2E);}

.tagline{position:absolute;top:.6rem;left:.6rem;display:flex;gap:.35rem;}
.tag{
  font-size:.64rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  padding:.25rem .5rem;border-radius:6px;background:rgba(0,0,0,.62);color:#fff;
  backdrop-filter:blur(4px);
}
.tag.pin{background:var(--yellow);color:#1A1A12;}
.tag.new{background:var(--red);}

.body{padding:.8rem .9rem .55rem;display:flex;flex-direction:column;gap:.35rem;}
.body .ttl{font-weight:750;font-size:1rem;line-height:1.3;}
.body .tx{font-size:.93rem;color:var(--ink-2);white-space:pre-wrap;}
.price{color:var(--green);font-weight:750;font-size:.95rem;}
.meta{
  display:flex;align-items:center;gap:.45rem;
  padding:.15rem .9rem .75rem;font-size:.74rem;color:var(--muted);
}
.meta svg{width:.9rem;height:.9rem;}
.meta .dots{margin-left:auto;padding:.15rem .4rem;border-radius:6px;font-size:1rem;line-height:1;color:var(--muted);}
.meta .dots:hover{background:var(--surface-2);}

.empty{text-align:center;color:var(--muted);font-size:.9rem;padding:2.5rem 1rem;}

/* ---------- tlacitko psani ---------- */
.fab{
  position:fixed;right:1rem;z-index:45;
  bottom:calc(1.1rem + env(safe-area-inset-bottom));
  width:3.5rem;height:3.5rem;border-radius:999px;
  background:var(--green);color:#08210F;
  display:grid;place-items:center;
  box-shadow:0 6px 20px -4px rgba(46,190,88,.5);
}
.fab svg{width:1.6rem;height:1.6rem;}


/* ---------- spodni panel ---------- */
.scrim{
  position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);
  opacity:0;visibility:hidden;transition:opacity .2s;
}
.scrim.on{opacity:1;visibility:visible;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;
  background:var(--surface);
  border-radius:18px 18px 0 0;
  border-top:1px solid var(--line);
  transform:translateY(100%);transition:transform .24s cubic-bezier(.32,.72,0,1);
  max-height:88vh;overflow-y:auto;
  padding:.6rem 1rem calc(1.4rem + env(safe-area-inset-bottom));
}
.sheet.on{transform:translateY(0);}
.grip{width:2.4rem;height:4px;border-radius:2px;background:var(--line);margin:.2rem auto .9rem;}
.sheet h2{margin:0 0 .8rem;font-size:1.05rem;font-weight:750;}
.sheet h3{margin:1.1rem 0 .5rem;font-size:.9rem;font-weight:750;color:var(--green);}
.sheet p{margin:0 0 .6rem;font-size:.92rem;color:var(--ink-2);}
.sheet ul{margin:0 0 .6rem;padding:0;list-style:none;display:flex;flex-direction:column;gap:.45rem;}
.sheet ul li{display:grid;grid-template-columns:1rem 1fr;gap:.5rem;font-size:.92rem;color:var(--ink-2);}
.sheet ul li::before{content:"";width:.35rem;height:.35rem;border-radius:50%;background:var(--green);margin-top:.5rem;margin-left:.3rem;}

.act{
  display:flex;align-items:center;gap:.75rem;width:100%;
  padding:.85rem .3rem;font-size:.98rem;text-align:left;
  border-bottom:1px solid var(--line);
}
.act:last-child{border-bottom:0;}
.act svg{width:1.2rem;height:1.2rem;color:var(--muted);flex:none;}
.act.danger{color:var(--red);}
.act.danger svg{color:var(--red);}

.field{
  width:100%;background:var(--surface-2);border:1px solid var(--line);
  border-radius:12px;padding:.75rem .85rem;font-size:.95rem;color:var(--ink);
  resize:vertical;min-height:6.5rem;line-height:1.5;
}
.field::placeholder{color:var(--muted);}
.pickrow{
  display:flex;align-items:center;gap:.6rem;margin:.7rem 0;
  padding:.7rem .85rem;border:1px dashed var(--line);border-radius:12px;
  color:var(--muted);font-size:.88rem;
}
.pickrow svg{width:1.2rem;height:1.2rem;flex:none;}
.pickrow:hover{border-color:var(--green);color:var(--ink-2);}

.nahled{position:relative;margin:.7rem 0;border-radius:12px;overflow:hidden;border:1px solid var(--line);}
.nahled img{width:100%;height:auto;display:block;max-height:16rem;object-fit:cover;}
.nahled button{
  position:absolute;top:.5rem;right:.5rem;
  width:2rem;height:2rem;border-radius:999px;
  background:rgba(0,0,0,.7);color:#fff;font-size:1.2rem;line-height:1;
  display:grid;place-items:center;
}
.rowbtns{display:flex;gap:.6rem;margin-top:.9rem;}
.btn{
  flex:1;padding:.8rem;border-radius:12px;font-weight:700;font-size:.95rem;text-align:center;
  background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
}
.btn.primary{background:var(--green);color:#08210F;border-color:var(--green);}
.toggle{display:flex;align-items:center;gap:.6rem;font-size:.92rem;color:var(--ink-2);margin-top:.2rem;}
.toggle input{width:1.1rem;height:1.1rem;accent-color:var(--green);}

.rows{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:.6rem;}
.r{display:flex;justify-content:space-between;gap:.8rem;padding:.65rem .85rem;border-bottom:1px solid var(--line);font-size:.92rem;}
.r:last-child{border-bottom:0;}
.r span{color:var(--muted);}
.r b{white-space:nowrap;font-variant-numeric:tabular-nums;}
.r.hi{background:var(--surface-2);}
.r.hi b{color:var(--green);font-size:1.05rem;}

.fill{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em;
  background:var(--surface-2);color:var(--yellow);padding:.08em .4em;border-radius:4px;
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<header class="topbar">
  <div class="brandrow">
    <div class="logo">
      <img src="img/znacka.png" width="160" height="160" alt="WEED420SHOP" onerror="this.remove();document.getElementById('lf').hidden=false">
      <span class="lf" id="lf" hidden>🌿</span>
    </div>
    <div class="who">
      <span class="n">WEED420SHOP</span>
      <span class="s"><b id="cnt">0</b> <span id="cntw">zpráv</span> &middot; píše jen správce</span>
    </div>
    <button class="iconbtn" id="btnSearch" type="button" aria-label="Hledat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
    <button class="iconbtn" id="btnInfo" type="button" aria-label="Více">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </button>
  </div>
  <div class="searchwrap" id="searchwrap">
    <input type="search" id="q" placeholder="Hledat ve zprávách…" autocomplete="off">
  </div>
  <div class="stripe"><i></i><i></i><i></i></div>
</header>

<main class="feed" id="feed"></main>

<button class="fab" id="fab" type="button" aria-label="Napsat zprávu">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grip"></div><div id="sheetBody"></div></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const HODINA = 3600e3, DEN = 24 * HODINA, TYDEN = 7 * DEN;

// Zpravy nesou skutecne casove razitko (ts). Zobrazovany cas i stitek
// "Novinka" se z nej pocitaji, takze spravce nic nenastavuje rucne.
const SEED = [
  { id:'m4', ph:'p', img:'img/produkt-3.jpg', w:1080, h:1440, ar:'3/4',
    title:'T.H.C. Indica Joint',
    text:'Předbalený cone v růžové tubě. True Hemp papírky, 100% konopí.',
    price:'[CENA] Kč / ks', ts: Date.now() - 3*HODINA, views:288 },

  { id:'m3', ph:'g', img:'img/produkt-2.jpg', w:1080, h:1440, ar:'3/4',
    title:'T.H.C. Sativa Joint',
    text:'Předbalený cone v zelené tubě. True Hemp papírky, 100% konopí.',
    price:'[CENA] Kč / ks', ts: Date.now() - 2*DEN, views:301 },

  { id:'m2', ph:'b', img:'img/produkt-1.jpg', w:1080, h:1440, ar:'3/4',
    title:'T.H.C. Hybrid Joint',
    text:'Předbalený cone v modré tubě. True Hemp papírky, 100% konopí.',
    price:'[CENA] Kč / ks', ts: Date.now() - 9*DEN, views:295 },

  { id:'m1', ph:null, img:null,
    title:'',
    text:'Vítej v našem kanálu. Novinky a nabídku dáváme sem — nikam jinam. Zapni si upozornění, ať ti nic neuteče.',
    price:'', ts: Date.now() - 20*DEN, views:530 }
];

const DNY = ['ne','po','út','st','čt','pá','so'];

function casText(ts){
  const d = new Date(ts);
  const rozdil = Date.now() - ts;
  if (rozdil < 60e3)   return 'teď';
  if (rozdil < HODINA) return 'před ' + Math.floor(rozdil / 60e3) + ' min';

  const hm = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  const dnesO = new Date(); dnesO.setHours(0,0,0,0);
  const denO  = new Date(ts); denO.setHours(0,0,0,0);
  const dni = Math.round((dnesO - denO) / DEN);

  if (dni <= 0) return hm;
  if (dni === 1) return 'včera ' + hm;
  if (dni < 7)   return DNY[d.getDay()] + ' ' + hm;
  return d.getDate() + '. ' + (d.getMonth() + 1) + '.';
}

const KEY = 'w420-kanal-v2';
let msgs;
try { msgs = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ msgs = null; }
if (!Array.isArray(msgs) || !msgs.length) msgs = SEED.map(m => ({...m}));
const save = () => {
  try { localStorage.setItem(KEY, JSON.stringify(msgs)); return true; }
  catch(e){ return false; }
};

// Uloziste prohlizece ma kolem 5 MB. Kdyz se fotka nevejde, rekni to
// nahlas - tise zahozena zprava je horsi nez chybova hlaska.
function ulozNeboRekni(){
  if (save()) return true;
  open(`<h2>Nevešlo se to</h2>
    <p>Paměť ukázky je plná — fotky zabírají místo. Smaž pár starších zpráv a zkus to znovu.</p>
    <p style="font-size:.85rem;color:var(--muted)">V ostré verzi tohle nenastane, fotky se ukládají na server.</p>
    <div class="rowbtns"><button class="btn primary" id="ok">Rozumím</button></div>`);
  $('#ok').addEventListener('click', close);
  return false;
}

let filter = '';

const ICON_EYE  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1.5 12S5 5.5 12 5.5 22.5 12 22.5 12 19 18.5 12 18.5 1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>';

function plural(n){ return n===1 ? 'zpráva' : (n>=2&&n<=4 ? 'zprávy' : 'zpráv'); }

function render(){
  const feed = $('#feed');
  const q = filter.trim().toLowerCase();
  const list = msgs.filter(m => !q || (m.title+' '+m.text).toLowerCase().includes(q));

  $('#cnt').textContent = msgs.length;
  $('#cntw').textContent = plural(msgs.length);

  // "Novinka" = cokoli mladsiho nez tyden. Stitek zmizi sam, spravce
  // ho nikde nezaskrtava ani neodskrtava.
  const jeNovinka = m => (Date.now() - m.ts) < TYDEN;

  // banner jen v nefiltrovanem pohledu
  const cover = q ? '' :
    '<div class="cover"><img src="img/banner.jpg" width="1200" height="450" alt="WEED420SHOP" onerror="this.closest(\'.cover\').remove()"></div>';

  if (!list.length){
    feed.innerHTML = cover + '<p class="empty">Nic nenalezeno.</p>';
    return;
  }

  const ordered = [...list].sort((a,b) => (b.pinned?1:0) - (a.pinned?1:0));
  feed.innerHTML = cover + ordered.map(m => {
    const tags = [];
    if (m.pinned) tags.push('<span class="tag pin">Připnuto</span>');
    if (jeNovinka(m)) tags.push('<span class="tag new">Novinka</span>');

    let shot = '';
    if (m.img || m.ph){
      const pic = m.img
        ? `<img src="${esc(m.img)}"${m.w ? ` width="${m.w}" height="${m.h}"` : ''} loading="lazy" decoding="async" alt="${esc(m.title)}" data-ph="${esc(m.ph||'')}" data-ar="${esc(m.ar||'4/3')}">`
        : `<div class="ph ${m.ph}" style="--ar:${esc(m.ar||'4/3')}"><span class="nm">${esc(m.title||'WEED420SHOP')}</span><span class="hint">sem přijde fotka</span></div>`;
      shot = `<div class="shot">
        ${pic}
        ${tags.length ? `<div class="tagline">${tags.join('')}</div>` : ''}
      </div>`;
    } else if (tags.length){
      shot = `<div style="padding:.7rem .9rem 0"><div class="tagline" style="position:static">${tags.join('')}</div></div>`;
    }

    return `<article class="msg ${m.pinned?'pinned':''}" data-id="${m.id}">
      ${shot}
      <div class="body">
        ${m.title ? `<span class="ttl">${esc(m.title)}</span>` : ''}
        <span class="tx">${esc(m.text)}</span>
        ${m.price ? `<span class="price">${esc(m.price)}</span>` : ''}
      </div>
      <div class="meta">
        <span>${esc(casText(m.ts))}</span>
        ${ICON_EYE}<span>${m.views}</span>
        <button class="dots" type="button" data-menu="${m.id}" aria-label="Možnosti zprávy">&#183;&#183;&#183;</button>
      </div>
    </article>`;
  }).join('');

  // chybejici fotka -> barevna plocha se stejnym pomerem stran
  feed.querySelectorAll('.shot img').forEach(im => {
    im.addEventListener('error', () => {
      const d = document.createElement('div');
      d.className = 'ph ' + (im.dataset.ph || 'n');
      d.style.setProperty('--ar', im.dataset.ar || '4/3');
      d.innerHTML = `<span class="nm">${esc(im.alt || 'WEED420SHOP')}</span><span class="hint">sem přijde fotka</span>`;
      im.replaceWith(d);
    }, { once:true });
  });

  feed.querySelectorAll('[data-menu]').forEach(b =>
    b.addEventListener('click', () => menu(b.dataset.menu)));
}

/* ---------- spodni panel ---------- */
const scrim = $('#scrim'), sheet = $('#sheet'), sheetBody = $('#sheetBody');
function open(html){ sheetBody.innerHTML = html; scrim.classList.add('on'); sheet.classList.add('on'); }
function close(){ scrim.classList.remove('on'); sheet.classList.remove('on'); }
scrim.addEventListener('click', close);

/* ---------- akce nad zpravou ---------- */
function menu(id){
  const m = msgs.find(x => x.id === id);
  if (!m) return;
  open(`
    <h2>${esc(m.title || 'Zpráva')}</h2>
    <button class="act" id="aEdit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h4L20 8l-4-4L4 16v4z"/></svg> Upravit</button>
    <button class="act" id="aPin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 17v5"/><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z"/></svg> ${m.pinned ? 'Odepnout' : 'Připnout nahoru'}</button>
    <button class="act danger" id="aDel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg> Smazat</button>
  `);
  $('#aEdit').addEventListener('click', () => edit(id));
  $('#aPin').addEventListener('click', () => {
    const was = m.pinned;
    msgs.forEach(x => x.pinned = false);
    m.pinned = !was;
    save(); render(); close();
  });
  $('#aDel').addEventListener('click', () => {
    open(`<h2>Smazat zprávu?</h2><p>Zmizí všem zákazníkům. Tohle nejde vrátit.</p>
      <div class="rowbtns"><button class="btn" id="no">Zpět</button><button class="btn" id="yes" style="background:var(--red);border-color:var(--red);color:#fff">Smazat</button></div>`);
    $('#no').addEventListener('click', close);
    $('#yes').addEventListener('click', () => {
      msgs = msgs.filter(x => x.id !== id); save(); render(); close();
    });
  });
}

/* ---------- fotka z telefonu ---------- */
// Fotka z mobilu ma klidne 4 MB. Zmensime ji rovnou v prohlizeci,
// jinak by se do uloziste nevesla a v kanalu by se dlouho nacitala.
async function zmensiFoto(file, max = 1280, kvalita = 0.8){
  let zdroj, w, h;

  if (window.createImageBitmap){
    try {
      // from-image srovna fotky z iPhonu otocene podle EXIF
      zdroj = await createImageBitmap(file, { imageOrientation: 'from-image' });
      w = zdroj.width; h = zdroj.height;
    } catch(e){ zdroj = null; }
  }
  if (!zdroj){
    zdroj = await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onerror = () => rej(new Error('Soubor se nepodařilo přečíst.'));
      fr.onload = () => {
        const im = new Image();
        im.onload = () => res(im);
        im.onerror = () => rej(new Error('Tenhle soubor není obrázek.'));
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
    w = zdroj.naturalWidth; h = zdroj.naturalHeight;
  }

  const s = Math.min(1, max / Math.max(w, h));
  const cw = Math.max(1, Math.round(w * s)), ch = Math.max(1, Math.round(h * s));
  const c = document.createElement('canvas');
  c.width = cw; c.height = ch;
  c.getContext('2d').drawImage(zdroj, 0, 0, cw, ch);
  if (zdroj.close) zdroj.close();

  return { url: c.toDataURL('image/jpeg', kvalita), w: cw, h: ch };
}

const POLE_FOTKY = `
  <label class="pickrow" for="foto">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5-5-6 6"/></svg>
    <span id="fotoTxt">Přidat fotku z telefonu</span>
  </label>
  <input type="file" id="foto" accept="image/*" hidden>
  <div id="fotoNahled"></div>`;

// Navesi obsluhu na pole fotky a vraci ctecku aktualniho vyberu.
function obsluhaFotky(pocatecni){
  let vybrana = pocatecni || null;
  const vstup = $('#foto'), popis = $('#fotoTxt'), nahled = $('#fotoNahled');

  const vykresli = () => {
    if (!vybrana){
      nahled.innerHTML = '';
      popis.textContent = 'Přidat fotku z telefonu';
      return;
    }
    popis.textContent = 'Vyměnit fotku';
    nahled.innerHTML = `<div class="nahled"><img src="${vybrana.url}" alt="Náhled"><button type="button" id="fotoPryc" aria-label="Odebrat fotku">&times;</button></div>`;
    $('#fotoPryc').addEventListener('click', () => { vybrana = null; vstup.value = ''; vykresli(); });
  };

  vstup.addEventListener('change', async () => {
    const f = vstup.files && vstup.files[0];
    if (!f) return;
    popis.textContent = 'Zpracovávám fotku…';
    try {
      vybrana = await zmensiFoto(f);
    } catch(e){
      popis.textContent = e.message + ' Zkus jinou.';
      vstup.value = '';
      return;
    }
    vykresli();
  });

  vykresli();
  return () => vybrana;
}

function edit(id){
  const m = msgs.find(x => x.id === id);
  const puvodni = m.img ? { url: m.img, w: m.w, h: m.h } : null;
  open(`
    <h2>Upravit zprávu</h2>
    ${POLE_FOTKY}
    <input class="field" id="eT" style="min-height:0" placeholder="Nadpis (nepovinný)" value="${esc(m.title)}">
    <div style="height:.6rem"></div>
    <textarea class="field" id="eX" placeholder="Text zprávy">${esc(m.text)}</textarea>
    <div style="height:.6rem"></div>
    <input class="field" id="eP" style="min-height:0" placeholder="Cena (nepovinná)" value="${esc(m.price)}">
    <div class="rowbtns"><button class="btn" id="c">Zrušit</button><button class="btn primary" id="s">Uložit</button></div>
  `);
  const fotka = obsluhaFotky(puvodni);
  $('#c').addEventListener('click', close);
  $('#s').addEventListener('click', () => {
    const f = fotka();
    m.title = $('#eT').value.trim();
    m.text  = $('#eX').value.trim();
    m.price = $('#eP').value.trim();
    m.img = f ? f.url : null;
    m.w = f ? f.w : null;
    m.h = f ? f.h : null;
    m.ar = f ? `${f.w}/${f.h}` : m.ar;
    if (!ulozNeboRekni()) return;
    render(); close();
  });
}

/* ---------- nova zprava ---------- */
$('#fab').addEventListener('click', () => {
  open(`
    <h2>Nová zpráva</h2>
    ${POLE_FOTKY}
    <input class="field" id="nT" style="min-height:0" placeholder="Nadpis (nepovinný)">
    <div style="height:.6rem"></div>
    <textarea class="field" id="nX" placeholder="Co je nového?"></textarea>
    <div style="height:.6rem"></div>
    <input class="field" id="nP" style="min-height:0" placeholder="Cena (nepovinná)">
    <label class="toggle" style="margin-top:.8rem"><input type="checkbox" id="nPin"> Připnout nahoru</label>
    <div class="rowbtns"><button class="btn" id="c">Zrušit</button><button class="btn primary" id="s">Odeslat</button></div>
  `);
  const fotka = obsluhaFotky(null);
  $('#c').addEventListener('click', close);
  $('#s').addEventListener('click', () => {
    const text = $('#nX').value.trim();
    const title = $('#nT').value.trim();
    const f = fotka();
    if (!text && !title && !f) { close(); return; }
    if ($('#nPin').checked) msgs.forEach(x => x.pinned = false);
    msgs.unshift({
      id: 'n' + Date.now(),
      pinned: $('#nPin').checked,
      ph: null,
      img: f ? f.url : null,
      w: f ? f.w : null,
      h: f ? f.h : null,
      ar: f ? `${f.w}/${f.h}` : null,
      title, text, price: $('#nP').value.trim(),
      ts: Date.now(), views: 1
    });
    if (!ulozNeboRekni()){ msgs.shift(); return; }
    render(); close();
    window.scrollTo({top:0, behavior:'smooth'});
  });
});

/* ---------- hledani ---------- */
$('#btnSearch').addEventListener('click', () => {
  const w = $('#searchwrap');
  w.classList.toggle('on');
  if (w.classList.contains('on')) $('#q').focus();
  else { $('#q').value = ''; filter = ''; render(); }
});
$('#q').addEventListener('input', e => { filter = e.target.value; render(); });

/* ---------- start ---------- */
render();

if ('serviceWorker' in navigator){
  const reg = () => navigator.serviceWorker.register('sw.js')
    .catch(e => console.warn('Service worker se nepodařilo zaregistrovat:', e.message));
  if (document.readyState === 'complete') reg();
  else window.addEventListener('load', reg);
}
